<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>게시판 메인</title>
    <style>
        /* 화면의 전체적인 스타일을 지정합니다. */
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            text-align: center; /* 전체 요소를 가운데로 정렬합니다. */
            margin: 0;
            padding: 50px;
        }

        /* 가장 큰 제목(게시판)의 스타일입니다. */
        h1 {
            font-size: 4em;
            margin-bottom: 20px;
        }

        /* 카테고리 분류 부분의 스타일입니다. */
        .category-section {
            font-size: 1.5em;
            margin-bottom: 60px;
            color: #333;
        }

        /* 카테고리 링크 버튼들을 예쁘게 꾸며줍니다. */
        .category-section a {
            text-decoration: none;
            color: black;
            margin: 0 10px;
            padding: 5px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fdfdfd;
        }

        /* 마우스를 올렸을 때 살짝 어두워지는 효과입니다. */
        .category-section a:hover {
            background-color: #eeeeee;
        }

        /* 이미지가 들어갈 커다란 빈 공간(자리 표시자)입니다. */
        .image-placeholder {
            width: 80%;
            max-width: 900px; /* 너무 넓어지지 않게 최대 너비를 제한합니다. */
            height: 400px;
            margin: 0 auto; /* 좌우 여백을 자동으로 맞추어 가운데 정렬합니다. */
            border: 2px dashed #999; /* 점선 테두리를 그립니다. */
            display: flex;
            align-items: center; /* 텍스트를 세로 중앙에 배치합니다. */
            justify-content: center; /* 텍스트를 가로 중앙에 배치합니다. */
            font-size: 1.5em;
            color: #666;
            background-color: #fafafa;
        }
        .auth-menu {
            margin-bottom: 30px;
        }
        .auth-menu a, .auth-menu button {
            display: inline-block;
            margin: 0 5px;
            padding: 8px 16px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: white;
            color: #333;
            text-decoration: none;
            cursor: pointer;
            font-size: 1em;
        }
        .auth-menu form {
            display: inline-block;
        }
    </style>
</head>
<body>

<h1>게시판</h1>

<div class="auth-menu">
    <div sec:authorize="isAnonymous()">
        <a th:href="@{/login}">로그인</a>
        <a th:href="@{/register}">회원가입</a>
    </div>
    <div sec:authorize="isAuthenticated()">
        <span><strong th:text="${nickname}">사용자</strong>님 환영합니다.</span>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">로그아웃</button>
        </form>
    </div>
</div>

<div class="category-section">
        <span>게시판 카테고리)</span>
        <a th:href="@{/board/취업}">취업</a>
        <a th:href="@{/board/자유게시판}">자유게시판</a>
        <a th:href="@{/board/건의/신고}">건의신고</a>
    </div>


</body>
</html>
