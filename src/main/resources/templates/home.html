<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>건양대학교 게시판</title>
    <style>
        /* 화면의 전체적인 스타일을 지정합니다. */
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px;
        }

        /* 로고 스타일 */
        .logo {
            margin-bottom: 20px;
        }
        .logo img {
            width: 300px; /* 로고 크기는 필요에 따라 조절하세요 */
        }

        /* 가장 큰 제목(게시판)의 스타일입니다. */
        h1 {
            font-size: 4em;
            font-weight: normal; /* 이미지처럼 폰트 두께를 얇게 조정 */
            margin-bottom: 20px;
        }

        /* 로그인/회원가입 메뉴 스타일입니다. */
        .auth-menu {
            margin-bottom: 60px;
        }
        .auth-menu a, .auth-menu button {
            display: inline-block;
            margin: 0 5px;
            padding: 8px 20px;
            border: 1px solid #a0a0a0; /* 이미지와 유사한 얇은 회색 테두리 */
            border-radius: 5px;
            background-color: white;
            color: #333;
            text-decoration: none;
            cursor: pointer;
            font-size: 1em;
        }
        .auth-menu form {
            display: inline-block;
        }

        /* 카테고리 분류 부분의 스타일입니다. */
        .category-section {
            display: flex;
            justify-content: center;
            gap: 120px; /* 카테고리 사이의 간격을 넓게 설정 */
            margin-top: 40px;
        }

        /* 카테고리 링크 버튼들을 텍스트 형태로 예쁘게 꾸며줍니다. */
        .category-section a {
            text-decoration: none;
            color: black;
            font-size: 2.5em; /* 텍스트 크기 확대 */
        }

        /* 마우스를 올렸을 때 색상이 살짝 변하는 효과입니다. */
        .category-section a:hover {
            color: #666;
        }
    </style>
</head>
<body>

<div class="logo">
    <img src="/images/logo.png" alt="건양대학교 로고">
</div>

<h1>건양대학교 게시판</h1>

<div class="auth-menu">
    <div sec:authorize="isAnonymous()">
        <a th:href="@{/login}">로그인</a>
        <a th:href="@{/register}">회원가입</a>
    </div>
    <div sec:authorize="isAuthenticated()">
        <span><strong th:text="${nickname}">사용자</strong>님 환영합니다.</span>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">로그아웃</button>
        </form>
    </div>
</div>

<div class="category-section">
    <a th:href="@{/board/취업}">취업</a>
    <a th:href="@{/board/자유게시판}">자유게시판</a>
    <a th:href="@{/board/건의/신고}">건의/신고</a>
</div>

</body>
</html>
