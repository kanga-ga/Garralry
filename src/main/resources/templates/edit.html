<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 50px; text-align: center; background-color: #f9f9f9; }
        .form-container {
            width: 50%; max-width: 600px; margin: 0 auto; text-align: left;
            background-color: white; border: 1px solid #ddd; padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
        input[type="text"], textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1em;
        }
        textarea { height: 200px; resize: none; }
        button {
            width: 100%; padding: 15px; background-color: #333; color: white;
            border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; font-weight: bold;
        }
        button:hover { background-color: #555; }
        .cancel-link { display: block; margin-top: 15px; text-align: center; color: #333; }
    </style>
</head>
<body>

<h1>게시글 수정하기</h1>

<div class="form-container">
    <!-- 기존 게시글 id로 수정 요청을 보내서 어떤 글을 바꿀지 컨트롤러가 알 수 있게 합니다. -->
    <form th:action="@{/articles/{id}/update(id=${article.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-group">
            <label for="category">카테고리</label>
            <select id="category" name="category" style="width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #ccc;">
                <option value="취업" th:selected="${article.category == '취업'}">취업</option>
                <option value="자유게시판" th:selected="${article.category == '자유게시판'}">자유게시판</option>
                <option value="건의사항" th:selected="${article.category == '건의사항'}">건의사항</option>
            </select>
        </div>
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" th:value="${article.title}" required>
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" th:text="${article.content}" required></textarea>
        </div>

        <button type="submit">수정 완료</button>
        <a th:href="@{/articles/{id}(id=${article.id})}" class="cancel-link">취소하고 돌아가기</a>
    </form>
</div>

</body>
</html>
