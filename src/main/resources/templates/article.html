<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.title}">게시글 상세</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 50px; background-color: #f9f9f9; }
        .article-container {
            width: 70%; max-width: 900px; margin: 0 auto; background-color: white;
            border: 1px solid #ddd; border-radius: 10px; padding: 40px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        h1 { margin-top: 0; color: #333; }
        .meta { color: #666; border-bottom: 1px solid #ddd; padding-bottom: 15px; margin-bottom: 30px; }
        .content { min-height: 250px; line-height: 1.8; white-space: pre-wrap; }
        .btn {
            display: inline-block; margin-top: 30px; padding: 10px 20px;
            background-color: #333; color: white; text-decoration: none; border-radius: 5px;
        }
        .delete-btn { border: none; cursor: pointer; background-color: #dc3545; font-size: 1em; }
        .action-form { display: inline-block; margin-left: 8px; }
        .comments { margin-top: 40px; border-top: 1px solid #ddd; padding-top: 25px; }
        .comment { border-bottom: 1px solid #eee; padding: 12px 0; }
        .comment-meta { color: #666; font-size: 0.9em; margin-bottom: 6px; }
        .comment-content { white-space: pre-wrap; line-height: 1.6; }
        .comment-form textarea { width: 100%; height: 90px; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        .comment-form button { margin-top: 10px; padding: 10px 20px; background-color: #333; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .comment-delete { padding: 5px 10px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="article-container">
    <h1 th:text="${article.title}">게시글 제목</h1>
    <div class="meta">
        <span>작성자: <strong th:text="${article.author}">닉네임</strong></span>
        <span> | </span>
        <span th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}">2026-06-10 12:00</span>
    </div>

    <div class="content" th:text="${article.content}">게시글 내용</div>

    <a th:href="@{/board/{category}(category=${article.category})}" class="btn">목록으로 돌아가기</a>
    <!-- 작성자 본인에게만 수정/삭제 버튼을 보여줍니다. 실제 권한 검사는 컨트롤러에서도 다시 합니다. -->
    <a th:if="${isAuthor}" th:href="@{/articles/{id}/edit(id=${article.id})}" class="btn">수정하기</a>
    <form th:if="${isAuthor}" th:action="@{/articles/{id}/delete(id=${article.id})}" method="post" class="action-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="btn delete-btn" onclick="return confirm('정말 삭제하시겠습니까?');">삭제하기</button>
    </form>

    <div class="comments">
        <h2>댓글</h2>

        <div th:if="${#lists.isEmpty(comments)}" style="color: #999;">아직 작성된 댓글이 없습니다.</div>

        <div th:each="comment : ${comments}" class="comment">
            <div class="comment-meta">
                <strong th:text="${comment.author}">작성자</strong>
                <span> | </span>
                <span th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">2026-06-10 12:00</span>
            </div>
            <div class="comment-content" th:text="${comment.content}">댓글 내용</div>
            <!-- 본인이 작성한 댓글만 삭제 버튼을 보여줍니다. 실제 삭제 권한은 컨트롤러에서 다시 검사합니다. -->
            <form th:if="${#lists.contains(myCommentIds, comment.id)}"
                  th:action="@{/articles/{articleId}/comments/{commentId}/delete(articleId=${article.id}, commentId=${comment.id})}"
                  method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="comment-delete" onclick="return confirm('댓글을 삭제하시겠습니까?');">댓글 삭제</button>
            </form>
        </div>

        <form sec:authorize="isAuthenticated()" th:action="@{/articles/{id}/comments(id=${article.id})}" method="post" class="comment-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <textarea name="content" placeholder="댓글을 입력하세요" required></textarea>
            <button type="submit">댓글 등록</button>
        </form>

        <p sec:authorize="isAnonymous()" style="color: #666;">댓글을 작성하려면 로그인해주세요.</p>
    </div>
</div>

</body>
</html>
