<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글쓰기 - 게시판</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 50px; text-align: center; background-color: #f9f9f9; }
        .form-container {
            width: 50%; max-width: 600px; margin: 0 auto; text-align: left;
            background-color: white; border: 1px solid #ddd; padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
        input[type="text"], textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1em;
        }
        textarea { height: 200px; resize: none; }
        button {
            width: 100%; padding: 15px; background-color: #333; color: white;
            border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; font-weight: bold;
        }
        button:hover { background-color: #555; }
    </style>
</head>
<body>

<h1>📝 새 글 작성하기</h1>

<div class="form-container">
    <form th:action="@{/articles/create}" method="post">
        <!-- Spring Security가 POST 요청을 안전한 요청인지 확인할 수 있도록 CSRF 토큰을 함께 보냅니다. -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-group">
            <label for="category">카테고리</label>
            <select id="category" name="category" style="width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #ccc;">
                <option value="취업" th:selected="${selectedCategory == '취업'}">취업</option>
                <option value="자유게시판" th:selected="${selectedCategory == '자유게시판'}">자유게시판</option>
                <option value="건의사항" th:selected="${selectedCategory == '건의사항'}">건의사항</option>
            </select>
        </div>
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" placeholder="제목을 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" placeholder="내용을 자유롭게 작성해보세요" required></textarea>
        </div>

        <button type="submit">게시글 등록하기</button>
    </form>
</div>

</body>
</html>
