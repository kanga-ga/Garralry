<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 갤러리</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 50px; }
        .form-box { display: inline-block; text-align: left; border: 1px solid #ddd; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 200px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #138496; }
        .home-link { display: block; margin-top: 20px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>

<h1>새로운 계정을 만들어보세요!</h1>

<div class="form-box">
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: #dc3545;"></p>

    <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="input-group">
            <label for="new-username">아이디</label>
            <input type="text" id="new-username" name="username" placeholder="사용할 아이디" required>
        </div>
        <div class="input-group">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" name="nickname" placeholder="게시글에 표시될 닉네임" required>
        </div>
        <div class="input-group">
            <label for="new-password">비밀번호</label>
            <input type="password" id="new-password" name="password" placeholder="사용할 비밀번호" required>
        </div>
        <div class="input-group">
            <label for="password-confirm">비밀번호 확인</label>
            <input type="password" id="password-confirm" name="passwordConfirm" placeholder="비밀번호 다시 입력" required>
        </div>
        <button type="submit">가입하기</button>
    </form>
</div>

<a th:href="@{/}" class="home-link">🏠 홈으로 돌아가기</a>

</body>
</html>
